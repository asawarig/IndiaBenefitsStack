name: Deploy to GitHub Pages

# Publishes the guide to https://<owner>.github.io/<repo>/
#
# Pages serves a project repo from /<repo>, so the build runs with
# BASE_PATH=/<repo> and PAGES=true — the latter drops the Cloudflare adapter,
# since Pages is static hosting with no Workers runtime. The Webflow Cloud
# build is untouched by this workflow and keeps its own mount path.

on:
  push:
    branches:
      - main
      - claude/page-hosting-webflow-alvu91
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ONE-TIME SETUP, done by a repo admin in the UI:
      #   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
      #
      # It cannot be automated here. enablement: true was tried and fails with
      # "Create Pages site failed. Resource not accessible by integration" -
      # creating a Pages site needs admin rights that the workflow's
      # GITHUB_TOKEN does not carry. Until that switch is flipped this step
      # fails with "Get Pages site failed / Not Found".
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          PAGES: 'true'
          # base_path from configure-pages is the full origin + subpath;
          # Astro wants just the subpath, which for a project repo is /<repo>.
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
